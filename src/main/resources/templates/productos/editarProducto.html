<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabeza('Editar producto')}"></head>
<body class="papel-reticulado">

<header th:replace="~{fragments/base :: barra('Edición de producto')}"></header>

<main class="contenedor">

    <div class="encabezado">
        <div>
            <p class="rotulo">Catálogo · Edición</p>
            <h1 class="titulo" th:text="${producto.nombre}">Producto</h1>
        </div>
    </div>

    <div class="taller">

        <form class="panel" method="post" enctype="multipart/form-data"
              th:action="@{/productos/edit/{id}(id=${producto.id})}" th:object="${productoDTO}">

            <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'campo-invalido'">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" class="control" th:field="*{nombre}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>

            <div class="pareja">
                <div class="campo" th:classappend="${#fields.hasErrors('marca')} ? 'campo-invalido'">
                    <label for="marca">Marca</label>
                    <input id="marca" type="text" class="control" th:field="*{marca}" autocomplete="off">
                    <span class="error" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('categoria')} ? 'campo-invalido'">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" class="control" th:field="*{categoria}">
                        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoría</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
                </div>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('precio')} ? 'campo-invalido'">
                <label for="precio">Precio en pesos</label>
                <input id="precio" type="number" step="0.01" min="0" class="control" th:field="*{precio}">
                <span class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('descripcion')} ? 'campo-invalido'">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" class="control" th:field="*{descripcion}"></textarea>
                <span class="pista">Entre 10 y 2000 caracteres.</span>
                <span class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('imagenArchivo')} ? 'campo-invalido'">
                <label for="imagenArchivo">Reemplazar foto</label>
                <input id="imagenArchivo" type="file" accept="image/*" class="control" th:field="*{imagenArchivo}">
                <span class="pista">Si no eliges un archivo, se conserva la foto actual.</span>
                <span class="error" th:if="${#fields.hasErrors('imagenArchivo')}" th:errors="*{imagenArchivo}"></span>
            </div>

            <div class="pareja">
                <div class="campo">
                    <label for="identificador">Identificador</label>
                    <input id="identificador" class="control" readonly th:value="${producto.id}">
                </div>
                <div class="campo">
                    <label for="alta">Fecha de alta</label>
                    <input id="alta" class="control" readonly
                           th:value="${producto.fechaCreado != null ? #dates.format(producto.fechaCreado, 'dd/MM/yyyy HH:mm') : '—'}">
                </div>
            </div>

            <div class="acciones-form">
                <button type="submit" class="boton boton-primario">Guardar cambios</button>
                <a class="boton boton-secundario" th:href="@{/productos}">Cancelar</a>
            </div>
        </form>

        <aside class="previa">
            <p class="previa-rotulo">Así se verá en el estante</p>
            <div class="etiqueta" data-etiqueta>
                <img class="etiqueta-foto" alt="" data-etiqueta-foto
                     th:src="@{'/images/' + ${producto.imagenArchivo}}">
                <div class="etiqueta-cuerpo">
                    <div class="etiqueta-categoria" data-etiqueta-categoria>Sin categoría</div>
                    <h2 class="etiqueta-nombre" data-etiqueta-nombre>Producto sin nombre</h2>
                    <p class="etiqueta-marca" data-etiqueta-marca>Marca sin definir</p>
                    <div class="etiqueta-precio"><small>ARS</small><span data-etiqueta-precio>0,00</span></div>
                </div>
            </div>
        </aside>

    </div>
</main>

<script th:src="@{/js/etiqueta.js}"></script>
</body>
</html>
