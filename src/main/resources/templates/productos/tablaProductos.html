<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabeza('Catálogo')}"></head>
<body class="papel-reticulado">

<header th:replace="~{fragments/base :: barra(${#lists.size(productos) + ' productos'})}"></header>

<main class="contenedor">

    <div class="encabezado">
        <div>
            <p class="rotulo">Inventario</p>
            <h1 class="titulo">Catálogo de productos</h1>
        </div>
        <div style="display:flex; gap:.75rem; flex-wrap:wrap">
            <a class="boton boton-secundario" th:href="@{/}">Volver al inicio</a>
            <a class="boton boton-primario" th:href="@{/productos/crear}">Nuevo producto</a>
        </div>
    </div>

    <div th:replace="~{fragments/base :: avisos}"></div>

    <!-- Estado vacío: una invitación a cargar el primer producto. -->
    <div class="vacio" th:if="${#lists.isEmpty(productos)}">
        <h2>El catálogo está vacío</h2>
        <p>Carga el primer producto y aparecerá acá con su etiqueta de estante.</p>
        <a class="boton boton-primario" th:href="@{/productos/crear}">Cargar el primer producto</a>
    </div>

    <section class="estante" th:unless="${#lists.isEmpty(productos)}">

        <div class="estante-cabecera" aria-hidden="true">
            <span>Foto</span>
            <span>Producto</span>
            <span>Categoría</span>
            <span style="text-align:right">Precio</span>
            <span>Alta</span>
            <span style="text-align:right">Acciones</span>
        </div>

        <article class="fila" th:each="producto : ${productos}">

            <img class="fila-foto"
                 th:src="@{'/images/' + ${producto.imagenArchivo}}"
                 th:alt="|Foto de ${producto.nombre}|">

            <div>
                <h2 class="fila-nombre" th:text="${producto.nombre}">Nombre</h2>
                <p class="fila-marca" th:text="${producto.marca}">Marca</p>
                <span class="fila-id" th:text="${producto.id}">id</span>
            </div>

            <div class="fila-categoria">
                <span class="categoria" th:text="${producto.categoria}">Categoría</span>
            </div>

            <!-- Elemento firma: el precio compuesto como etiqueta de góndola. -->
            <div class="fila-precio">
                <div class="ticket">
                    <div class="ticket-moneda">ARS</div>
                    <div class="ticket-precio"
                         th:text="${#numbers.formatDecimal(producto.precio, 1, 'POINT', 2, 'COMMA')}">0,00
                    </div>
                </div>
            </div>

            <div class="fila-fecha"
                 th:text="${producto.fechaCreado != null ? #dates.format(producto.fechaCreado, 'dd/MM/yyyy') : '—'}">
                —
            </div>

            <div class="fila-acciones">
                <a class="boton boton-secundario boton-chico"
                   th:href="@{/productos/edit/{id}(id=${producto.id})}">Editar</a>
                <form method="post"
                      th:action="@{/productos/delete/{id}(id=${producto.id})}"
                      th:data-confirmar="${producto.nombre}">
                    <button type="submit" class="boton boton-peligro boton-chico">Eliminar</button>
                </form>
            </div>

        </article>
    </section>

</main>

<script th:src="@{/js/catalogo.js}"></script>
</body>
</html>
