# Nombre de la aplicacion
spring.application.name=beastore

# Configuracion de MongoDB
# Se puede sobrescribir con la variable de entorno MONGODB_URI.
# Ejemplo con autenticacion: mongodb://usuario:clave@127.0.0.1:27017/beastore?authSource=admin
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/beastore}
spring.data.mongodb.auto-index-creation=true

# Carpeta donde se guardan las imagenes subidas (relativa al directorio de ejecucion)
app.upload.dir=${UPLOAD_DIR:public/images}

# Limites de subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf: desactivar cache en desarrollo
spring.thymeleaf.cache=false
